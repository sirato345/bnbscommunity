# fly.toml - 安全免费配置
app = "bnbsserver"
primary_region = "sjc"  # 美国圣何塞（推荐）

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TZ = "America/Los_Angeles"
  PYTHON_VERSION = "3.12"
  PYTHONUNBUFFERED = "true"
  PYTHONDONTWRITEBYTECODE = "true"

# 明确指定使用免费配置
[machine]
  cpus = 1
  memory = "512mb"
  # 关键：允许自动停止，但设置长延迟
  # auto_stop_delay = "1h"  # 6小时无流量才停止

[http_service]
  internal_port = 8080
  force_https = true
  # 改为 true，但配合 auto_stop_delay
  auto_stop_machines = false
  
  [[http_service.checks]]
    interval = "600s"  # 延长到10分钟
    timeout = "20s"
    grace_period = "90s"
    method = "GET"
    path = "/health"