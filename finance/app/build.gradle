apply plugin: 'com.android.application'

android {
    namespace = 'com.finance'

    compileSdk rootProject.ext.compile_sdk_version

    defaultConfig {
        applicationId "com.finance"
        minSdk rootProject.ext.min_sdk_version
        targetSdk rootProject.ext.target_sdk_version
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled true  // 建议开启混淆
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    sourceSets {
        main {
            resources.srcDirs = [
                    'src/main/resources',
                    'src/main/resources/property',
                    'src/main/resources/graphic',
                    'src/main/resources/initialdata'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17  // 升级到Java 17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}